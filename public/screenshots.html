<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Marvel Tracker Screenshots</title>
<style>
  body { margin: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; gap: 40px; font-family: 'Inter', sans-serif; }
  h1 { color: #E81C2E; letter-spacing: 0.12em; margin: 0; font-size: 24px; text-transform: uppercase; }
  .caption { color: #F5C518; font-size: 12px; margin: 0; text-align: center; text-transform: uppercase; letter-spacing: 0.1em; }
  img { border-radius: 20px; box-shadow: 0 0 60px rgba(232,28,46,0.25), 0 8px 32px rgba(0,0,0,0.6); max-width: 390px; width: 100%; display: block; }
  .screen { display: flex; flex-direction: column; align-items: center; gap: 12px; }
</style>
</head>
<body>
<h1>Marvel Watch Tracker</h1>
<div class="screen">
  <div class="caption">Onboarding</div>
  <img id="s1" />
</div>
<div class="screen">
  <div class="caption">Main Tracker</div>
  <img id="s2" />
</div>
<div class="screen">
  <div class="caption">Achievements</div>
  <img id="s3" />
</div>
<script>
  const screenshots = {
    s1: '__S1__',
    s2: '__S2__',
    s3: '__S3__'
  };
  document.getElementById('s1').src = screenshots.s1;
  document.getElementById('s2').src = screenshots.s2;
  document.getElementById('s3').src = screenshots.s3;
</script>
</body>
</html>
